---
layout: default
---

{% include base_path %}

<main id="main" class="portfolio-main" role="main">
  <article class="portfolio-page" itemscope itemtype="https://schema.org/Person">
    {% if page.title %}<meta itemprop="name" content="{{ page.title | strip_html | escape_once }}">{% endif %}
    {% if page.description or page.excerpt %}
      <meta itemprop="description" content="{{ page.description | default: page.excerpt | strip_html | escape_once }}">
    {% endif %}
    <div class="portfolio-page__inner">
      {{ content }}
    </div>
  </article>
</main>

<button class="back-to-top" type="button" data-back-to-top aria-label="Back to top">
  <span aria-hidden="true">↑</span>
</button>
