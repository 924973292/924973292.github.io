{% include base_path %}

<!-- Prevent a light-theme flash before the stylesheet loads. -->
<script>
  (function() {
    var saved = localStorage.getItem("portfolio-theme");
    var preferred = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", saved || preferred);
  }());
</script>

<link rel="icon" type="image/png" href="{{ base_path }}/images/site-logo.png">
<link rel="apple-touch-icon" href="{{ base_path }}/images/site-logo.png">
<link rel="mask-icon" href="{{ base_path }}/images/safari-pinned-tab.svg" color="#0f766e">
<meta name="theme-color" content="#f7f8f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101716" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css">

{% if page.mathjax %}
  <script type="text/x-mathjax-config">
    MathJax.Hub.Config({
      TeX: { equationNumbers: { autoNumber: "all" } },
      tex2jax: {
        inlineMath: [ ["$","$"], ["\\(","\\)"] ],
        processEscapes: true
      }
    });
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/latest.js?config=TeX-MML-AM_CHTML" async></script>
{% endif %}
