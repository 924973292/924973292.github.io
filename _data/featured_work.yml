id: TRACE
short_name: "TRACE"
kicker: "Latest work"
title: "TRACE: Trajectory-robust Admission with Evidence Ordering for Efficient GUI Agents"
expansion: "Trajectory-robust Admission and Coverage-aware Evidence ordering"
authors: "<strong>Yuhao Wang</strong>, Mu Qiao, Xindong Zhang, Lei Zhang, Yunzhi Zhuge, Huchuan Lu"
role: "First author"
venue: "arXiv preprint"
year: 2026
status: "Preprint"
area: "Efficient Agent Systems"
question: "How can training-free visual-token pruning stay useful across a GUI trajectory when discarded tokens cannot be recovered?"
problem: "GUI agents accumulate high-resolution screenshots as the trajectory unfolds, raising inference latency and memory use. Training-free pruning can cut that cost, but cache reuse makes the choice irreversible: once tokens are discarded, the corresponding visual evidence cannot be recovered without re-encoding. The admission decision must therefore remain useful for unknown future targets, while still covering operable regions under a tight budget."
insight: "TRACE is a training-free framework for trajectory-robust admission and coverage-aware evidence ordering. It ranks visual evidence by potential future utility and diversity, then repairs missing spatial coverage without breaking that order, so retained tokens can shrink monotonically and stay reusable."
why_it_matters: "The current research edge is not only compressing a single screenshot, but making visual evidence survive an unfolding GUI trajectory under a tight budget."
evaluation: "Verified across six GUI benchmarks and diverse models. Source code will be released."
stages:
  - index: "01"
    title: "Rank"
    text: "A query-independent layout-derived interaction prior is combined with instruction relevance and feature novelty, ranking visual evidence by both potential future utility and diversity."
  - index: "02"
    title: "Cover"
    text: "Part of the budget is reserved for native visual tokens distributed across the screen, repairing missing spatial coverage without breaking the ordering."
  - index: "03"
    title: "Nest"
    text: "The result is a nested token order: retained visual evidence shrinks monotonically across budgets while remaining reusable throughout the trajectory."
  - index: "04"
    title: "Contract"
    text: "Monotone KV contraction incrementally contracts retired frames into compact session state, avoiding repeated visual encoding or pruning."
components:
  - "Layout-derived interaction prior"
  - "Instruction relevance"
  - "Feature novelty"
  - "Native-token coverage repair"
  - "Nested token order"
  - "Monotone KV contraction"
