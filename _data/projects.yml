- id: efficient-mllm-pruning
  order: 1
  featured: true
  theme: "efficient-intelligence"
  eyebrow: "LATEST PAPER / EFFICIENT MLLM"
  title: "ERA: logit-preserving visual token pruning"
  tagline: "Preserve visual evidence—even after aggressively shortening the sequence."
  role: "First author"
  partner: "DLUT · NTU S-Lab · OPPO Research Institute · PolyU"
  status: "Public preprint & code"
  year: "2026"
  problem: "Training-free token pruning accelerates MLLMs, but replacing many visual tokens with a few representatives systematically suppresses accumulated visual attention."
  motivation: "Pruning is only useful when the reduced sequence preserves both the content and attention distribution of the original visual evidence."
  method: "Dual-view entropy pruning finds diverse, head-salient anchors; bias-aware token recycling records pruned evidence; logit-preserving rectification restores the missing attention mass."
  contribution: "Identifies Attention Logit Collapse, gives it a principled treatment, and validates the approach across single-image, multi-image, video, multiple MLLM architectures, and a vLLM serving environment."
  outcomes:
    - metric: "~5%"
      label: "tokens retained in extreme settings"
    - metric: "5 families"
      label: "representative MLLM families"
    - metric: "vLLM"
      label: "serving-level verification"
  tags:
    - "Efficient MLLM"
    - "Visual Token Pruning"
    - "Attention Rectification"
  related_publications:
    - "ERA"
  links:
    - label: "Paper"
      url: "https://arxiv.org/abs/2606.31982"
    - label: "Code"
      url: "https://github.com/924973292/ERA"

- id: edge-gui-agent
  order: 2
  featured: true
  theme: "on-device-agents"
  eyebrow: "LATEST WORK / EDGE INTELLIGENCE"
  title: "Training-free acceleration for on-device GUI agents"
  tagline: "Remove redundant multimodal computation before it becomes device latency."
  role: "Research & deployment"
  partner: "OPPO Y-Lab collaboration"
  status: "Research in progress"
  year: "2025–now"
  problem: "High-resolution GUI observations generate substantial visual-token redundancy, while mobile devices impose strict latency, memory, and package-size constraints."
  motivation: "An agent that understands an interface but cannot respond within a practical device budget is not yet deployable."
  method: "A training-free large-model pruning strategy for GUI interfaces, paired with system-level optimization for terminal deployment."
  contribution: "Connects model-side redundancy reduction with end-to-end deployment constraints, without requiring additional model training."
  disclosure: "Selected implementation and evaluation details are described at a high level because this is ongoing collaborative research."
  outcomes:
    - metric: "2.5×"
      label: "faster time-to-first-token"
    - metric: "30 ms"
      label: "first-token latency in deployment"
    - metric: "300 MB"
      label: "optimized model package"
  tags:
