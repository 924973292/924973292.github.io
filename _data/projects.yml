- id: text-enhanced-reid
  order: 3
  featured: true
  theme: "multimodal-foundation-models"
  eyebrow: "CVPR 2025 / MULTIMODAL PERCEPTION"
  title: "Text-enhanced multimodal object re-identification"
  tagline: "Use language to expose identity cues that visual fusion alone can miss."
  role: "First author"
  status: "Published"
  year: "2025"
  image: "IDEA.png"
  problem: "Conventional multimodal ReID systems fuse heterogeneous visual features but underuse text semantics and retain redundant local observations."
  motivation: "Structured text can provide a shared semantic space for objects observed under different spectra and viewpoints."
  method: "IDEA combines an inverted multimodal feature extractor with cooperative deformable aggregation and text-enhanced benchmarks."
  contribution: "Introduces semantic guidance from MLLM-generated captions and adaptive local aggregation for robust multimodal retrieval."
  outcomes:
    - metric: "3"
      label: "text-enhanced benchmarks"
    - metric: "CVPR"
      label: "peer-reviewed publication"
